# Publishes this n8n community node package to npm on every version tag push.
#
# n8n requires community nodes submitted for verification to be published via
# GitHub Actions with an npm provenance statement (from May 1, 2026).
#
# ONE-TIME SETUP (npmjs.com):
#   1. Open the package settings > Publish access > Trusted Publishers.
#   2. Add a publisher: GitHub Actions, repository owner "markurquhart",
#      repository name "braze-n8n-node", workflow name "publish.yml".
#   3. Leave NPM_TOKEN unset in repo secrets to use OIDC.
#
# RELEASE: run `npm run release` locally to bump the version, tag, and push.
# That push matches the tag filter below and triggers this workflow.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
